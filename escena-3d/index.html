<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';

import GUI from 'lil-gui';

/* =====================================================================
   CONFIG — todo lo ajustable vive aquí; el panel lee y escribe en este objeto.
   Unidades: "u" = unidades del mundo 3D (la esfera mide 16 u de radio).
   Ángulos en grados · velocidades de giro en grados/segundo.
   ===================================================================== */
const layer=(o={})=>Object.assign({on:true,color:'#ffffff',intensity:1,size:10,length:1,thickness:1,rotation:0,rotSpeed:0},o);
const flareDef=(o={})=>({
  core:layer(o.core), glow:layer(o.glow),
  rays:layer({count:22,lenRand:.64,angRand:1,widthMin:.37,widthMax:2.2,tipSoft:1,seed:7,...o.rays}),
  anam:layer({lines:1,height:6,fade:1,...o.anam}),
  cross:layer({lenH:75,lenV:85,...o.cross}),
  star:layer({points:6,...o.star}),
  halo:layer({chroma:.03,...o.halo}),
  ghosts:layer({count:5,spacing:.42,chroma:.25,...o.ghosts}),
  chroma:o.chroma ?? .015,
  behavior:{flicker:'ninguno',flickerSpeed:1,flickerAmp:.1,hoverGrow:.3,hoverStretch:.5,hoverDur:.35,occlusion:true,occStrength:1,maxScale:3,...o.behavior},
});

const CONFIG={
  flares:{
    center:flareDef({
      core:{on:true,color:'#ffffff',intensity:.9,size:14},
      glow:{color:'#d8c8ff',intensity:.45,size:62},
      rays:{on:false,color:'#f2dcff',intensity:1.18,size:323.2,length:1.3833,thickness:1.1074,widthMin:.98,rotSpeed:.57},
      anam:{on:false,color:'#f0e8ff',intensity:.32,size:1,length:300,thickness:.62},
      cross:{on:false,color:'#f4f0ff',intensity:.4,size:1,length:.67,lenH:220,lenV:160,thickness:.5},
      star:{on:false,color:'#e8e0ff',intensity:.35,size:150,thickness:.35,points:6},
      halo:{on:false,color:'#cbb8ff',intensity:.25,size:64,thickness:1.2},
      ghosts:{on:false,color:'#b9a8ff',intensity:1.61,size:.07,thickness:.5},
      chroma:.015,
      behavior:{flicker:'respiración',flickerSpeed:.7,flickerAmp:.13,hoverGrow:.12,hoverStretch:.3,hoverDur:.6,maxScale:4},
    }),
    projectsMode:'todos',          // 'todos' (mismos ajustes) | 'individual'
    projectsEdit:'01',
    projects:flareDef({
      core:{color:'#f4f0ff',intensity:.95,size:6},
      glow:{color:'#8e7dff',intensity:.22,size:34},
      rays:{on:false,color:'#eae6ff',intensity:.35,size:40,count:14,widthMin:.08,widthMax:.35},
      anam:{on:false,color:'#eae6ff',intensity:.3,size:1,length:90,thickness:.3},
      cross:{color:'#eae6ff',intensity:.72,size:1,lenH:75,lenV:85,thickness:.31},
      star:{on:false,color:'#eae6ff',intensity:.4,size:22,thickness:.3,points:4},
      halo:{on:false,color:'#b9a8ff',intensity:.3,size:14,thickness:.35},
      ghosts:{on:false,color:'#b9a8ff',intensity:.12,size:.03,thickness:.4},
      chroma:.01,
      behavior:{flicker:'ninguno',flickerSpeed:1.2,flickerAmp:.1,hoverGrow:.45,hoverStretch:.7,hoverDur:.35,maxScale:3},
    }),
    perProject:[],                 // se rellena abajo (una copia por proyecto)
  },
  sphere:{
    radius:10.5, spin:-13.07, color:'#ced4ff', opacity:1,
    veins:{intensity:.91,scale:2.07,speed:.12,octaves:4},
    fresnel:{intensity:1.96,power:1.86},
    grid:{lon:16,lat:12,opacity:.12},
    nodes:{count:545,dist:3.4,links:2,density:.55,opacity:.35,points:0},
    scan:{on:true,speed:1.34,width:.059,intensity:.53,color:'#f3edff'},
    hot:{count:7,color:'#ff9a4a',pulse:.5,size:2.4},
    brackets:{on:true,ticks:true,opacity:1,spin:-1.15},
  },
  orbits:{
    rings:[ // inclinaciones y fase inicial calculadas para reproducir el encuadre del boceto
      {radius:116.2,tiltX:48.77, tiltZ:-16.03, phase:-45.92,spin:1.1, speed:1.6, opacity:.42,gaps:3,wear:.45,double:true,ticks:false,tickDensity:3},
      {radius:116.1,tiltX:-67.41,tiltZ:-151.32,phase:-42.26,spin:-.7, speed:1.2, opacity:.42,gaps:3,wear:.45,double:true,ticks:true, tickDensity:3},
      {radius:108.3,tiltX:-25.35,tiltZ:90,     phase:103.89,spin:.9,  speed:-1.4,opacity:.42,gaps:3,wear:.45,double:true,ticks:false,tickDensity:3},
      {radius:124.5,tiltX:45.51, tiltZ:111.82, phase:77.08, spin:-1.2,speed:1.0, opacity:.42,gaps:3,wear:.45,double:true,ticks:true, tickDensity:3},
      {radius:127.4,tiltX:9.76,  tiltZ:-98.33, phase:-72.92,spin:.6,  speed:-.9, opacity:.42,gaps:3,wear:.45,double:true,ticks:false,tickDensity:3},
    ],
    systemSpinOn:false, systemSpin:.04, color:'#b4b6e6', markers:true, markerSpeed:1.06,
    amber:{on:true,dashed:true,opacity:.35,color:'#ff9a4a'},
  },
  projects:{
    list:[{name:'PROYECTO'},{name:'PROYECTO'},{name:'PROYECTO'},{name:'PROYECTO'},{name:'PROYECTO'}],
    labels:'siempre', labelSize:7, labelOpacity:.23, dimOthers:.45, hoverBoost:.37, ringGlow:2.5, amberDot:true,
  },
  bg:{base:'#211d35',c1:'#61306c',c2:'#ad5076',c3:'#edaaa0',dirAz:-139.4,dirEl:-18,width:1,amount:.85,scale:1.5,dust:1,stars:.35,starBright:0,drift:.004},
  film:{grain:.044,grainSize:.9,grainSpeed:24,blotches:.75,blotchScale:2.2,blotchContrast:1,blotchSpeed:.05,dust:.6,
        vignette:1.45,vignetteIrr:.55,dirt:1,halation:1,halationColor:'#ffc4cb',ca:.02},
  trails:{count:16,color:'#ffd7a0',speed:1.09,length:.1},
  dust:{count:700,size:1,bright:1},
  camera:{fov:40,roll:-6.9,autoRotate:true,autoSpeed:.18,damping:.05,minDist:20,maxDist:1600,introDur:6,travelDur:2.2,home:[230,135,185]},
  post:{exposure:.3,bloomStrength:.79,bloomRadius:.75,bloomThreshold:.69,toneMapping:'ACES'},
  text:{position:'abajo-derecha',size:14,spacing:.62,opacity:1,glow:.7},
};

/* ======== utilidades ======== */
const DEG=Math.PI/180;
const clone=o=>JSON.parse(JSON.stringify(o));
const seeded=s=>{ let a=(Math.floor(s*2654435761)>>>0)||1; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; };
const hash1=x=>{ const s=Math.sin(x*127.1+311.7)*43758.5453; return s-Math.floor(s); };
const vnoise=x=>{ const i=Math.floor(x), f=x-i, u=f*f*(3-2*f); return hash1(i)*(1-u)+hash1(i+1)*u; };
const smoothstep=(a,b,x)=>{ const t=Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); };
const clamp01=x=>Math.min(1,Math.max(0,x));
const easeIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const randDir=(r)=>{ const z=r()*2-1, th=r()*Math.PI*2, s=Math.sqrt(1-z*z); return new THREE.Vector3(Math.cos(th)*s,z,Math.sin(th)*s); };
function noise1(x,seed){ return Math.sin(x*3.1+seed)*.5+Math.sin(x*7.7+seed*2.3)*.3+Math.sin(x*17.3+seed*5.1)*.2; }
// copia valores de src en target sin romper las referencias (el panel sigue enlazado)
function deepAssign(target,src){
  if(!src||typeof src!=='object') return;
  for(const k of Object.keys(src)){
    if(!(k in target)) continue;
    const sv=src[k], tv=target[k];
    if(Array.isArray(tv)&&Array.isArray(sv)){ sv.forEach((v,i)=>{ if(i>=tv.length) return; if(tv[i]&&typeof tv[i]==='object') deepAssign(tv[i],v); else if(typeof v===typeof tv[i]) tv[i]=v; }); }
    else if(tv&&typeof tv==='object'){ deepAssign(tv,sv); }
    else if(typeof sv===typeof tv){ target[k]=sv; }
  }
}
CONFIG.flares.perProject=[0,1,2,3,4].map(i=>{ const d=clone(CONFIG.flares.projects); const r=seeded(31+i*17); d.cross.lenH=Math.round(60+r()*30); d.cross.lenV=Math.round(70+r()*30); return d; });
const DEFAULTS=clone(CONFIG);
function onProjectOpen(id){ /* vacío a propósito: aquí se abrirá el proyecto */ }
window.onProjectOpen=onProjectOpen;

/* ======== renderer / escena / cámara ======== */
let W=innerWidth, H=innerHeight;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(W,H);
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=CONFIG.post.exposure;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(CONFIG.camera.fov,W/H,.1,8000);
const HOME=new THREE.Vector3().fromArray(CONFIG.camera.home);
camera.position.copy(HOME);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.autoRotate=true; controls.autoRotateSpeed=.18;
let autoPaused=false; controls.addEventListener('start',()=>{ autoPaused=true; });

/* ======== NEBULOSA pintada (shader en esfera) ======== */
const sky=new THREE.Mesh(new THREE.SphereGeometry(6000,96,48),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,
 uniforms:{uOff:{value:0},uBase:{value:new THREE.Color()},uC1:{value:new THREE.Color()},uC2:{value:new THREE.Color()},uC3:{value:new THREE.Color()},
   uDust:{value:1},uNeb:{value:.85},uReg:{value:new THREE.Vector3()},uRW:{value:1},uScale:{value:1.5},uStarThr:{value:.9993},uStarB:{value:1}},
 vertexShader:`varying vec3 vD; void main(){ vD=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
 fragmentShader:`
  uniform float uOff,uDust,uNeb,uRW,uScale,uStarThr,uStarB; uniform vec3 uBase,uC1,uC2,uC3,uReg; varying vec3 vD;
  float h(vec3 p){ return fract(sin(dot(p,vec3(12.9898,78.233,37.719)))*43758.5453); }
  float n(vec3 p){ vec3 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
    return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x),mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x),f.y),mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x),mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y),f.z);}
  float fbm(vec3 p){ float v=0.,a=.5; for(int i=0;i<6;i++){ v+=a*n(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=.5;} return v;}
  void main(){
    vec3 d=normalize(vD); vec3 p=d*uScale+vec3(0.,0.,uOff);
    vec3 q=vec3(fbm(p),fbm(p+vec3(5.2,1.3,2.8)),fbm(p+vec3(1.3,7.1,4.4)));
    float f=fbm(p+2.2*q);
    float reg=exp(-pow(acos(clamp(dot(d,uReg),-1.,1.))/uRW,2.)*1.6);
    float em=smoothstep(.38,.95,f)*reg*uNeb;
    vec3 col=uBase*(1.+.6*(d.y*.5+.5));
    col=mix(col,uC1,smoothstep(.0,.35,em)*.9);
    col=mix(col,uC2,smoothstep(.25,.75,em)*.85);
    col+=uC3*pow(smoothstep(.55,1.,em),2.)*.55;
    float du=fbm(d*3.2+q*1.4);
    col*=1.-uDust*smoothstep(.48,.72,du)*reg*.85;
    vec3 g=floor(d*420.); float s=h(g); float st=step(uStarThr,s)*(.25+.4*h(g+1.))*uStarB;
    col+=mix(vec3(.8,.85,1.),vec3(1.,.8,.9),h(g+2.))*st*(.5+reg*.8);
    gl_FragColor=vec4(col,1.);
  }`}));
sky.renderOrder=-2; scene.add(sky);

/* ======== polvo cercano (se envuelve alrededor de la cámara: infinito) ======== */
const dustMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  uniforms:{uCam:{value:new THREE.Vector3()},uBox:{value:700},uPR:{value:renderer.getPixelRatio()},uSize:{value:1},uBright:{value:1}},
  vertexShader:`uniform vec3 uCam; uniform float uBox,uPR,uSize,uBright; attribute float seed; varying float vA;
    void main(){ vec3 p=mod(position-uCam+uBox*.5,uBox)-uBox*.5+uCam; vec4 mv=modelViewMatrix*vec4(p,1.);
      vA=(1.-smoothstep(uBox*.25,uBox*.5,length(p-uCam)))*(.15+.6*seed)*uBright; gl_PointSize=clamp((.5+seed)*uPR*160.*uSize/-mv.z,1.,4.*uPR*uSize); gl_Position=projectionMatrix*mv; }`,
  fragmentShader:`varying float vA; void main(){ float d=length(gl_PointCoord-.5); gl_FragColor=vec4(.85,.82,1.,smoothstep(.5,0.,d)*vA); }`});
let dustPts=null;
function buildDust(N){
  if(dustPts){ scene.remove(dustPts); dustPts.geometry.dispose(); }
  const r=seeded(99), BOX=700, g=new THREE.BufferGeometry(), p=new Float32Array(N*3), s=new Float32Array(N);
  for(let i=0;i<N;i++){ p[i*3]=(r()-.5)*BOX; p[i*3+1]=(r()-.5)*BOX; p[i*3+2]=(r()-.5)*BOX; s[i]=r(); }
  g.setAttribute('position',new THREE.BufferAttribute(p,3)); g.setAttribute('seed',new THREE.BufferAttribute(s,1));
  dustPts=new THREE.Points(g,dustMat); dustPts.frustumCulled=false; scene.add(dustPts);
}

/* ======== líneas imperfectas (alfa por vértice: huecos, desgaste) ======== */
const fadeLineMat=(color,op)=>new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  uniforms:{uC:{value:new THREE.Color(color)},uO:{value:op},uDraw:{value:1}},
  vertexShader:`attribute float a; attribute float u; varying float vA; varying float vU; void main(){ vA=a; vU=u; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform vec3 uC; uniform float uO,uDraw; varying float vA; varying float vU; void main(){ if(vU>uDraw) discard; gl_FragColor=vec4(uC,vA*uO); }`});
function lineGeo(pts,alphaFn){ const g=new THREE.BufferGeometry().setFromPoints(pts); const a=new Float32Array(pts.length),u=new Float32Array(pts.length);
  pts.forEach((_,i)=>{ u[i]=i/(pts.length-1); a[i]=alphaFn(u[i],i); }); g.setAttribute('a',new THREE.BufferAttribute(a,1)); g.setAttribute('u',new THREE.BufferAttribute(u,1)); return g; }
function segGeo(arr,al,uu){ const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(arr,3)); g.setAttribute('a',new THREE.Float32BufferAttribute(al,1)); g.setAttribute('u',new THREE.Float32BufferAttribute(uu,1)); return g; }
function circle(r,seg){ const p=[]; for(let i=0;i<=seg;i++){ const a=i/seg*Math.PI*2; p.push(new THREE.Vector3(Math.cos(a)*r,0,Math.sin(a)*r)); } return new THREE.BufferGeometry().setFromPoints(p); }
function disposeChildren(g){ g.children.slice().forEach(o=>{ g.remove(o); o.geometry?.dispose(); o.material?.dispose(); }); }

/* ======== texturas de luz ======== */
function radial(stops){ const c=document.createElement('canvas'); c.width=c.height=256; const g=c.getContext('2d'); const r=g.createRadialGradient(128,128,0,128,128,128);
  stops.forEach(([o,a])=>r.addColorStop(o,`rgba(255,255,255,${a})`)); g.fillStyle=r; g.fillRect(0,0,256,256); return new THREE.CanvasTexture(c); }
const texCore=radial([[0,1],[.07,.95],[.18,.3],[.45,.07],[1,0]]);
const spr=(tex,color,s,op=1)=>{ const m=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,color,transparent:true,opacity:op,depthWrite:false,blending:THREE.AdditiveBlending})); m.scale.set(s,s,1); return m; };

/* ======== ESFERA TECNOLÓGICA central ======== */
const sphere=new THREE.Group(); scene.add(sphere);
const surf=new THREE.Mesh(new THREE.SphereGeometry(16,128,96),new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  uniforms:{uVT:{value:0},uScanPh:{value:0},uVI:{value:.55},uVS:{value:2.6},uOct:{value:5},uFI:{value:.9},uFP:{value:2.6},uLon:{value:18},uLat:{value:12},uGO:{value:.12},

const intro={on:false,t:0}; let travel=null, focus=null; const focusPrev=new THREE.Vector3(), FAR=new THREE.Vector3(), ORIGIN=new THREE.Vector3();
function startIntro(){ intro.on=true; intro.t=0; focus=null; travel=null; autoPaused=false; HOME.fromArray(CONFIG.camera.home); controls.enabled=false; controls.target.set(0,0,0); }
function travelTo(kind,i){ travel={t:0,kind,i,fromPos:camera.position.clone(),fromTgt:controls.target.clone()}; focus=null; intro.on=false; controls.enabled=false; }
function openProject(i){ travelTo('project',i); onProjectOpen(`0${i+1}`); }

const _to=new THREE.Vector3(), _tt=new THREE.Vector3(), _d=new THREE.Vector3();
function cameraStep(dt){
  if(intro.on){
    intro.t+=dt; const p=clamp01(intro.t/Math.max(.1,CONFIG.camera.introDur)), e=easeIO(clamp01(p/.88));
    FAR.set(HOME.x*1.8,HOME.y+900,HOME.z*1.8); camera.position.lerpVectors(FAR,HOME,e); controls.target.set(0,0,0);
    if(p>=1){ intro.on=false; controls.enabled=true; }
  } else if(travel){
    travel.t+=dt/Math.max(.1,CONFIG.camera.travelDur); const k=clamp01(travel.t), e=easeIO(k);
    if(travel.kind==='project'){ const P=projs[travel.i].world; _tt.copy(P); _to.copy(P).add(_d.copy(P).normalize().multiplyScalar(48)); _to.y+=14; }
    else { _tt.copy(ORIGIN); _to.copy(HOME); }
    camera.position.lerpVectors(travel.fromPos,_to,e); camera.position.y+=Math.sin(e*Math.PI)*travel.fromPos.distanceTo(_to)*.12;
    controls.target.lerpVectors(travel.fromTgt,_tt,e);
    if(k>=1){ if(travel.kind==='project'){ focus=travel.i; focusPrev.copy(projs[travel.i].world); } travel=null; controls.enabled=true; }
  } else if(focus!==null){ const P=projs[focus].world; _d.subVectors(P,focusPrev); camera.position.add(_d); controls.target.add(_d); focusPrev.copy(P); }

/* ======== reconstrucciones bajo demanda (solo cuando cambia un ajuste estructural) ======== */
const keys={};
function rebuildIfChanged(){
  const S=CONFIG.sphere;
  rings.forEach(r=>{ const c=CONFIG.orbits.rings[r.i]; const k=[c.radius,c.gaps,c.wear,c.double,c.ticks,c.tickDensity].join(); if(k!==r.key){ r.key=k; buildRing(r);} });
  const kn=[S.nodes.count,S.nodes.dist,S.nodes.links,S.nodes.density].join(); if(kn!==keys.nodes){ keys.nodes=kn; buildNodes(); }
  const kh=Math.round(S.hot.count); if(kh!==keys.hot){ keys.hot=kh; buildHots(); }
  const kt=Math.round(CONFIG.trails.count); if(kt!==keys.trails){ keys.trails=kt; buildTrails(kt); }
  const kd=Math.round(CONFIG.dust.count); if(kd!==keys.dust){ keys.dust=kd; buildDust(kd); }
}

/* ======== bucle ======== */

  // esfera
  sphere.scale.setScalar(S.radius/16); bracket.scale.setScalar(S.radius/16);
  sphere.rotation.y+=S.spin*DEG*dt; bracket.rotation.y+=S.brackets.spin*DEG*dt;
  veinT+=S.veins.speed*dt; scanPh+=S.scan.speed*dt; hotPh+=S.hot.pulse*dt;

  su.uScan.value=S.scan.on?1:0; su.uScanW.value=S.scan.width; su.uScanI.value=S.scan.intensity; su.uCol.value.set(S.color); su.uScanCol.value.set(S.scan.color);

  bracketTicks.forEach(l=>{ l.visible=S.brackets.ticks; l.material.uniforms.uC.value.set(O.color); l.material.uniforms.uO.value=.6*S.brackets.opacity; });

// ---- copiar / pegar ----
async function copyCfg(){ const s=JSON.stringify(CONFIG,null,2);
  try{ await navigator.clipboard.writeText(s); toast('copiado'); }
  catch{ const ta=document.createElement('textarea'); ta.value=s; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('copiado'); }catch{ toast('no se pudo copiar'); } ta.remove(); } }
const pasteEl=document.getElementById('paste'), pasteTa=document.getElementById('pasteTa');
function openPaste(){ pasteTa.value=''; pasteEl.classList.add('on'); setTimeout(()=>pasteTa.focus(),30); }
document.getElementById('pasteCancel').addEventListener('click',()=>pasteEl.classList.remove('on'));
document.getElementById('pasteOk').addEventListener('click',()=>{ try{ const o=JSON.parse(pasteTa.value); applyConfig(o); pasteEl.classList.remove('on'); toast('ajustes aplicados'); }catch{ toast('JSON no válido'); } });

addEventListener('resize',()=>{ W=innerWidth; H=innerHeight; camera.aspect=W/H; camera.updateProjectionMatrix(); renderer.setSize(W,H); composer.setSize(W,H);
  flareCam.right=W; flareCam.top=H; flareCam.updateProjectionMatrix(); fin.uniforms.uRes.value.set(W,H); });
startIntro();
loop();
